<!DOCTYPE html><html lang="zh-CN"> <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="LifeFrame personal gallery"><title>LifeFrame</title><link rel="stylesheet" href="/my-life-frame-site/styles/global.css"> <meta name="robots" content="noindex, nofollow"> <link rel="stylesheet" href="/my-life-frame-site/_astro/upload.C9j3Nnwg.css"></head> <body> <header class="app-header"> <a class="brand" href="/my-life-frame-site/"> <span class="brand-mark" aria-hidden="true"></span> <span>LifeFrame</span> </a> <nav aria-label="主导航"> <a href="/my-life-frame-site/">时间线</a> <a href="/my-life-frame-site/folders/">文件夹</a> <a href="/my-life-frame-site/albums/">相册</a> </nav> </header> <main>    <section id="password-gate" class="upload-card"> <p class="eyebrow">身份验证</p> <h1>请输入访问密码</h1> <div class="input-row"> <input type="password" id="password-input" placeholder="输入密码后按回车" autofocus> <button id="password-submit" class="btn-primary">验证</button> </div> <p id="password-error" class="error-text hidden"></p> </section>  <section id="workspace" class="hidden"> <!-- Token 输入 --> <section class="upload-card" id="token-section"> <p class="eyebrow">GitHub 授权</p> <h1>输入 GitHub Token</h1> <p class="hint">Token 仅在当前页面内存中保存，刷新后即失效。需要 <code>repo</code> 权限。</p> <div class="input-row"> <input type="password" id="token-input" placeholder="ghp_..."> <button id="token-toggle" class="btn-text" title="显示/隐藏">👁️</button> <button id="token-verify" class="btn-primary">验证</button> </div> <p id="token-status" class="hidden"></p> </section> <!-- 拖拽上传区 --> <section class="upload-card" id="drop-section"> <p class="eyebrow">选择照片</p> <h1>拖拽照片到此处</h1> <div id="dropzone"> <p id="dropzone-prompt">将照片拖拽到这里，或点击选择文件</p> <p class="hint">支持 JPG / PNG / WebP / AVIF / SVG，每批最多 20 张，单张上限 25MB</p> <input type="file" id="file-input" multiple accept="image/*" hidden> </div> </section> <!-- 文件队列 --> <section id="queue" class="hidden"> <div class="queue-header"> <div> <p class="eyebrow">编辑信息</p> <h1>照片信息</h1> </div> <div class="queue-actions"> <button id="btn-upload-all" class="btn-primary">开始上传</button> <button id="btn-clear-all" class="btn-text">清空</button> </div> </div> <div id="queue-list"></div> <div id="progress-bar" class="hidden"> <div id="progress-fill"></div> </div> <p id="progress-text" class="hidden"></p> </section> <!-- 结果 --> <section id="results" class="hidden"> <div class="upload-card"> <p class="eyebrow">上传结果</p> <h1 id="results-title"></h1> <div id="results-list"></div> <p class="hint">照片已上传到 GitHub 仓库，几分钟后网站将自动更新。</p> <button id="btn-reset" class="btn-primary">开始新批次</button> </div> </section> </section>  </main> </body></html>  <script type="module" src="/my-life-frame-site/_astro/upload.astro_astro_type_script_index_0_lang.BXfB7UWx.js"></script>
